<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日报 {{DATE}}</title>
<meta name="description" content="{{HEADLINE}}">
<base target="_blank">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one ~68ch reading column. Date strip → day headline → overview card
     (the one tinted block: 主线 / 跨板块 / 接下来看) → section index, then per Feed tab: label row (name · item count) → lede → takeaway list with
     source chips. Palette and faces mirror src/styles/tokens.css. The server sets
     data-mode on the root from the dashboard toggle; without it, follow the OS. */
  :root {
    --paper: #fdfcfb;
    --ink: #1f1b17;
    --ink-2: #5a534b;
    --ink-3: #71695f;
    --rule: rgba(40, 30, 20, 0.12);
    --chip: #efece8;
    --accent: #1f4e79;
    --f-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "PingFang SC",
              "Hiragino Sans GB", "Hiragino Sans", "Noto Sans SC", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-mode="light"]) {
      --paper: #211e1b; --ink: #ece8e3; --ink-2: #aaa39a; --ink-3: #8f877e;
      --rule: rgba(255, 240, 220, 0.10); --chip: #2a2622;
      --accent: color-mix(in srgb, #1f4e79 55%, white); color-scheme: dark;
    }
  }
  :root[data-mode="dark"] {
    --paper: #211e1b; --ink: #ece8e3; --ink-2: #aaa39a; --ink-3: #8f877e;
    --rule: rgba(255, 240, 220, 0.10); --chip: #2a2622;
    --accent: color-mix(in srgb, #1f4e79 55%, white); color-scheme: dark;
  }

  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.8 var(--f-sans);
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-block: 28px 56px;
  }
  main { max-width: 68ch; margin-inline: auto; display: grid; gap: 28px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  header { display: grid; gap: 10px; }
  .dateline {
    margin: 0; font: 500 12px/1.4 var(--f-mono); color: var(--ink-3);
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  h1 { margin: 0; font-size: 22px; line-height: 1.45; font-weight: 600; text-wrap: balance; }
  .overview { display: grid; gap: 10px; padding: 16px 18px; border: 0; border-radius: 8px; background: var(--chip); }
  .overview h2 { margin: 0; }
  .overview p { margin: 0; text-wrap: pretty; }
  .overview b { font-weight: 600; margin-right: 6px; }
  .index { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px/1.6 var(--f-mono); }
  .index a { color: var(--ink-2); }
  .index span { color: var(--ink-3); }

  section { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--rule); }
  h2 {
    margin: 0; display: flex; align-items: baseline; gap: 10px;
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
  }
  h2 .count { font: 400 11px var(--f-mono); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .lede { margin: 0; font-weight: 500; text-wrap: pretty; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
  li { min-width: 0; padding-left: 14px; border-left: 2px solid var(--rule); }
  li strong { font-weight: 600; }
  .src { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 4px; vertical-align: 1px; }
  .src a {
    font: 11px/1.7 var(--f-mono); padding: 0 6px; border-radius: 4px;
    background: var(--chip); color: var(--ink-2); white-space: nowrap;
  }
  .src a:hover { color: var(--accent); text-decoration: none; }
  .empty { margin: 0; color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <header>
    <p class="dateline">{{DATE}} · {{WINDOW_LABEL}} · {{ITEM_COUNT}} 条</p>
    <h1>{{HEADLINE}}</h1>
  </header>

  <section class="overview" id="overview">
    <h2>综述</h2>
    <p><b>主线</b>{{今天最重要的脉络：发生了什么、驱动因素是什么}}</p>
    <p><b>跨板块</b>{{板块之间的联动或背离，例如宏观变量同时影响股市和加密}}</p>
    <p><b>接下来看</b>{{接下来值得关注的时间点、价位或事件}}</p>
  </section>

  <nav class="index">
    <!-- One link per section, in section order. -->
    <a href="#{{SECTION_ID}}">{{CATEGORY}} <span>{{N}}</span></a>
  </nav>

  <!-- Repeat one <section> per category, in items.json order.
       id = lowercase category name; count = that category's item count in items.json. -->
  <section id="{{SECTION_ID}}">
    <h2>{{CATEGORY}} <span class="count">{{N}} 条</span></h2>
    <p class="lede">{{一句话总览}}</p>
    <ul>
      <li><strong>{{要点}}</strong> {{一两句：发生了什么、为什么重要}}<span class="src"><a href="{{LINK}}">{{SOURCE}}</a></span></li>
    </ul>
  </section>

  <!-- An empty category keeps its section: -->
  <section id="{{SECTION_ID}}">
    <h2>{{CATEGORY}} <span class="count">0 条</span></h2>
    <p class="empty">无重要更新</p>
  </section>
</main>
</body>
</html>
